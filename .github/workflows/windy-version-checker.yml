name: Check Windy Embed Version

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run version check
        id: check
        run: node scripts/check-windy-version.js

      - name: Format snapshot and create PR
        if: steps.check.outputs.updated == 'true'
        # The version fields come from Windy's script, so they reach the shell as data, not as code.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDY_VERSION: ${{ steps.check.outputs.version }}
          WINDY_BUILD: ${{ steps.check.outputs.build }}
          WINDY_ASSETS: ${{ steps.check.outputs.assets }}
        run: |
          # Format the snapshot file using Prettier
          npx prettier --write scripts/windy-embed-snapshot.js

          # Configure Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Create a new branch
          BRANCH_NAME="windy-update-${WINDY_ASSETS}"
          git checkout -b "$BRANCH_NAME"

          # Stage and commit the changes
          git add scripts/windy-embed-version.json scripts/windy-embed-snapshot.js
          git commit -m "chore(deps): update Windy embed script to ${WINDY_VERSION}"

          # Push the branch. The checkout keeps no credentials, so the token goes in here.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH_NAME" --force

          # Create the Pull Request using GitHub CLI
          gh pr create \
            --title "chore(deps): Windy embed script update detected (${WINDY_VERSION})" \
            --body "A new version of the Windy embed script has been detected online.
            
            - **Version:** ${WINDY_VERSION}
            - **Build Date:** ${WINDY_BUILD}
            - **Assets Path:** ${WINDY_ASSETS}
            
            Please review the file changes in this Pull Request to check if there are any updates to available layers, products, or parameter schemas." \
            --base main \
            --head "$BRANCH_NAME"
